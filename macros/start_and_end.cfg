[gcode_macro PRINT_START]
gcode:
  ## Simple wrapper for more traditional PRINT_START 
  START_PRINT BED_TEMP={ params.BED|default(0.0)|float } EXTRUDER_TEMP={ params.EXTRUDER|default(0.0)|float } CHAMBER_TEMP={ params.CHAMBER|default(0.0)|float }

[gcode_macro PRINT_END]
gcode:
  ## Simple wrapper for more traditional PRINT_END
  END_PRINT

[gcode_macro START_PRINT]
gcode:
    ##
    ## ------ Parameters and Initial Values ------ ##
    ##
    {% set CHAMBER_TARGET = params.CHAMBER_TEMP|default(0.0)|float %}
    {% set BED_TARGET = params.BED_TEMP|default(0.0)|float %}
    {% set EXTRUDER_TARGET = params.EXTRUDER_TEMP|default(0.0)|float %}
    {% set bed_t_i = printer.heater_bed.temperature %}
    {% set chamber_t_i = printer["temperature_sensor chamber_temperature"].temperature %}
    {% set nozzle_t_i = printer.extruder.temperature %}
    UPDATE_DELAYED_GCODE ID=heat_soaker DURATION=0

    SKEW_PROFILE LOAD=CaliFlower

    ##
    ## ------ Initial Heat Soak ------ ##
    ##
    M117 Starting
    {% if chamber_t_i < CHAMBER_TARGET - 2 %}
      M117 Bed 110 (Chamber preheat)
      M140 S110
    {% else %}
      M117 Bed { BED_TARGET }
      M140 S{ BED_TARGET }
    {% endif %}
    
    CONDITIONAL_HOME
    G90
    G0 Z15 F{ 40*60 }
    G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 - 20 } F{ 400*60 }
    {% if chamber_t_i < CHAMBER_TARGET - 2 %}
        # Chamber needs a full heatup, get the fan involved and put bed temperature to max
        _SET_FAN_SPEED PERCENT=50
        M140 S110
    {% endif %}
    {% if bed_t_i > BED_TARGET - 10 and chamber_t_i > CHAMBER_TARGET - 2 %}
      # We're basically pre-heated, let's just let the bed and nozzle settle for a couple minutes, if necessary
      M117 Wait 1m
      G4 P{60*1000}
    {% elif bed_t_i < BED_TARGET - 10 and chamber_t_i > CHAMBER_TARGET - 1 %}
      # Chamber is residual warmed up, but let's let the bed heat soak a bit
      M190 S{ BED_TARGET }
      M117 Bed wait 3m
      G4 P{60*3000} # Let bed stabilize for 3 minutes
    {% else %}
      M117 Chamber { CHAMBER_TARGET }
      TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temperature" MINIMUM={ CHAMBER_TARGET - 1 }
      _SET_FAN_SPEED PERCENT=0 # Let the bed stabilize without the fan for the last degree
      TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temperature" MINIMUM={ CHAMBER_TARGET }
      # Return the bed to the print temperature if we extra-heated
      M190 S{ BED_TARGET }
    {% endif %}

    ##
    ## ------ Initial Homing ------ ##
    ##
    _SET_FAN_SPEED PERCENT=0
    G90  # Use absolute coordinates
    CONDITIONAL_HOME

    ##
    ## ------ Print Start ------ ##
    ##
    # Go to start location of purge line to catch ooze while nozzle heats up
    G0 X2.5 Y2 F3000 ; Go to front
    G0 Z0.25 ; Drop to bed
    M117 Extruder { EXTRUDER_TARGET }
    M109 S{ EXTRUDER_TARGET }
    M117 Purging
    PURGE_LINE
    G21 ; set units to millimeters
    G90 ; use absolute coordinates
    M83 ; use relative distances for extrusion
    M117 Printing!

[gcode_macro END_PRINT]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z - 2]|min %}
    {% set z_presented = [th.position.z + 40, th.axis_maximum.z - 2]|min %}
    
    SET_SKEW CLEAR=1
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-2.0 F1800                 ; retract filament
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing


    REVO_RETRACT

    M107 ;turn off fan
    TURN_OFF_HEATERS
    # Uncomment below to turn on post-print cleaning (could impact high-Y prints)
    # G4 P{30*1000}
    # CLEAN_NOZZLE
    G1 Z{z_presented} F600 #moved bed down to present the print
    
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    M84
    STATUS_READY
    M117 Done
    #MARIO