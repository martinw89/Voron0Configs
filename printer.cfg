#####################################################################
#   ADXL345
#####################################################################
[mcu rpi]
serial: /tmp/klipper_host_mcu

# ALERT! MARTIN! YOU THERE!
# The stupid picobilical board will go into a bootloop if it powers
# on with the ADXL cable connected to the Pi. To use the ADXL, you
# MUST power on the system with the ADXL disconnected from the toolhead
# board, and then plug it in after Klipper is fully online.
[adxl345]
cs_pin: rpi:None
axes_map: -x,z,y

[resonance_tester]
accel_chip: adxl345
probe_points:
    60, 60, 20  # an example
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

[input_shaper]
